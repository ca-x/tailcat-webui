name: Release Binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 11.3.0 }
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum
      - run: make verify

  release:
    name: Create release draft
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true

  binary:
    name: Build ${{ matrix.platform }}
    needs: [verify, release]
    if: ${{ always() && needs.verify.result == 'success' && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch') && (github.event_name == 'workflow_dispatch' || needs.release.result == 'success') }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-amd64, goos: linux, goarch: amd64, binary: tailcat-webui, archive: tar.gz }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64, goos: linux, goarch: arm64, binary: tailcat-webui, archive: tar.gz }
          - { runner: windows-latest, platform: windows-amd64, goos: windows, goarch: amd64, binary: tailcat-webui.exe, archive: zip }
          - { runner: macos-latest, platform: darwin-amd64, goos: darwin, goarch: amd64, binary: tailcat-webui, archive: tar.gz }
          - { runner: macos-latest, platform: darwin-arm64, goos: darwin, goarch: arm64, binary: tailcat-webui, archive: tar.gz }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build web assets
        working-directory: web
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm build
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum
      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          rm -rf webdist/dist
          cp -R web/dist webdist/dist
          mkdir -p dist/package
          go build -trimpath \
            -ldflags="-s -w -X github.com/ca-x/tailcat-webui/internal/version.Version=${{ github.ref_name }} -X github.com/ca-x/tailcat-webui/internal/version.BuildTime=$(date -u '+%Y-%m-%dT%H:%M:%SZ') -X github.com/ca-x/tailcat-webui/internal/version.GitCommit=${{ github.sha }}" \
            -o dist/package/${{ matrix.binary }} ./cmd/tailcat-webui
          cp README.md README_ZH.md LICENSE NOTICE.md dist/package/
      - name: Package archive
        shell: bash
        run: |
          cd dist/package
          if [ '${{ matrix.archive }}' = 'zip' ]; then
            7z a ../tailcat-webui-${{ matrix.platform }}.zip .
          else
            tar czf ../tailcat-webui-${{ matrix.platform }}.tar.gz .
          fi
          cd ..
          sha256sum tailcat-webui-${{ matrix.platform }}.* > tailcat-webui-${{ matrix.platform }}.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: tailcat-webui-${{ matrix.platform }}
          path: |
            dist/tailcat-webui-${{ matrix.platform }}.*
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/tailcat-webui-${{ matrix.platform }}.*

  docker-build:
    name: Build release image (${{ matrix.arch }})
    needs: [verify, release]
    if: ${{ always() && needs.verify.result == 'success' && startsWith(github.ref, 'refs/tags/') && needs.release.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: amd64, platform: linux/amd64 }
          - { runner: ubuntu-24.04-arm, arch: arm64, platform: linux/arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: buildmeta
        run: echo "time=$(date -u '+%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ steps.buildmeta.outputs.time }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
      - name: Export image digest
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker:
    name: Publish multi-architecture release image
    needs: [verify, release, docker-build]
    if: ${{ always() && needs.verify.result == 'success' && startsWith(github.ref, 'refs/tags/') && needs.release.result == 'success' && needs.docker-build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: release-image-digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$REGISTRY_IMAGE@sha256:%s " *)
      - name: Inspect published image
        run: docker buildx imagetools inspect "ghcr.io/${{ github.repository }}:${{ github.ref_name }}"

  finalize:
    name: Publish verified release
    needs: [binary, docker]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true

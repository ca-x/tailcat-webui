name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Frontend, Go, and container checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Scan source for high-confidence secret patterns
        run: make check-secrets

      - uses: pnpm/action-setup@v6
        with:
          version: 11.3.0
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install frontend dependencies without lifecycle scripts
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify frontend dependency graph
        working-directory: web
        run: |
          pnpm peers check
          pnpm audit --audit-level high
      - name: Lint, test, and build frontend
        working-directory: web
        run: |
          pnpm lint
          pnpm test
          pnpm build
      - name: Verify committed embedded web assets
        run: diff -qr web/dist webdist/dist

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum
      - name: Verify Go modules and generated Ent code
        run: |
          go mod verify
          go generate ./ent
          git diff --exit-code -- ent
      - name: Vet and race-test Go
        run: |
          go vet ./...
          go test -race ./...
      - name: Build embedded pure-Go binary
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -o /tmp/tailcat-webui ./cmd/tailcat-webui

      - uses: docker/setup-buildx-action@v4
      - name: Verify container build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  target-compile:
    name: Compile ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-amd64, goos: linux, goarch: amd64, binary: tailcat-webui-linux-amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64, goos: linux, goarch: arm64, binary: tailcat-webui-linux-arm64 }
          - { runner: ubuntu-24.04, platform: windows-amd64, goos: windows, goarch: amd64, binary: tailcat-webui-windows-amd64.exe }
          - { runner: ubuntu-24.04, platform: darwin-amd64, goos: darwin, goarch: amd64, binary: tailcat-webui-darwin-amd64 }
          - { runner: ubuntu-24.04-arm, platform: darwin-arm64, goos: darwin, goarch: arm64, binary: tailcat-webui-darwin-arm64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum
      - name: Verify compile inputs
        run: |
          go mod verify
          test -s webdist/dist/index.html
      - name: Compile tracked embedded assets without publishing
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p "$RUNNER_TEMP/tailcat-compile"
          go build -trimpath -o "$RUNNER_TEMP/tailcat-compile/${{ matrix.binary }}" ./cmd/tailcat-webui
          test -s "$RUNNER_TEMP/tailcat-compile/${{ matrix.binary }}"

  windows-transfer-runtime:
    name: Private filesystem and transfer runtime (Windows)
    runs-on: windows-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
          cache-dependency-path: go.sum
      - name: Verify modules and Windows private filesystem behavior
        run: |
          go mod verify
          go test -count=1 ./internal/privatefs ./internal/transfer
